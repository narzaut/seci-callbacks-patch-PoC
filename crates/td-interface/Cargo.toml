[package]
name = "td-interface"
version = "0.1.0"
edition = "2021"

[dependencies]
td-protocol = { path = "../td-protocol" }
anyhow = "1"
thiserror = "1"
log = "0.4"
obfstr = "0.4.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }